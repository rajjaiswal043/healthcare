packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency postinstall scripts by default — a good default, since
# an install script is arbitrary code execution from a package you may not have
# read. This is the explicit, reviewed allowlist. Add to it only with a reason.
#
#   @prisma/engines / prisma — download the query engine binary at install time.
#   esbuild                  — compiles its native binary (used by vitest).
#   @swc/core                — native binary; compiles the API. Needed because
#                              esbuild cannot emit decorator metadata, which
#                              NestJS dependency injection depends on.
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  # sharp — native image codecs, used by next/image optimisation.
  sharp: true

# Forced versions of transitive dependencies, to pull in security fixes ahead of
# the parent package shipping them. Each entry should say what it fixes and be
# removed once the parent catches up.
#
#   find-my-way — GHSA-c96f-x56v-gq3h, HTTP/2 DDoS, fixed in 9.6.1.
#                 Reached via @nestjs/platform-fastify, which still permits <=9.6.0.
#   sharp       — inherited libvips vulnerabilities, fixed in 0.35.0.
#                 Reached via next (image optimisation).
#   postcss     — arbitrary file read + source-map path traversal, fixed in 8.5.18.
#                 Reached via next.
#   nanoid      — GHSA-2v37-7h3g-55p8, a custom generator loops forever when
#                 asked for size zero, fixed in 3.3.18. Reached only through
#                 postcss, so it is build tooling rather than anything shipped —
#                 but `pnpm audit --audit-level=high` is part of `verify`, which
#                 the pre-push hook runs, and a gate that is routinely red stops
#                 being read. Remove once postcss requires 3.3.18 itself.
#   deepmerge-ts — GHSA-ggr8-5vv4-36mx, stack exhaustion on a recursive object
#                 graph. The fix is only in 8.x; 7.1.6 shipped after it and is
#                 still vulnerable, so there is no in-major escape.
overrides:
  find-my-way: '>=9.6.1'
  #   sharp       — GHSA-rgj7-g3m4-5g8c, two libheif flaws reachable through the
  #                 bundled decoder. Fixed in 0.35.4. Reached twice: directly from
  #                 the API, which resizes clinic logos, and through next's image
  #                 optimiser. The bound was '>=0.35.0' and resolved 0.35.3, which
  #                 is still vulnerable — an open range is only as good as the
  #                 floor you put under it.
  #                 7 Oct 2026: moved again, to 0.35.5 — GHSA-wq5f-xc86-pv6w.
  #                 sharp decodes bytes a patient's clinic uploaded, so this is
  #                 the one shipping dependency on this list where the
  #                 vulnerable code path is plainly reachable.
  sharp: '>=0.35.5'
  postcss: '>=8.5.18'
  # Caret, not '>=': an open range resolved to nanoid 6, which is ESM-only and
  # not what postcss expects. The fix shipped in the 3.x line, so stay in it.
  nanoid: '^3.3.18'
  # This one forces a MAJOR bump past an exact pin: @prisma/config depends on
  # "deepmerge-ts": "7.1.5", not a range. Safe in practice because v8 still
  # ships a CommonJS build alongside the ESM one and keeps the deepmerge /
  # deepmergeCustom surface — but @prisma/config is on the hot path for
  # prisma.config.ts, so if a Prisma upgrade ever starts failing to read its own
  # config, look here first. Remove once @prisma/config pins 8.x itself.
  deepmerge-ts: '^8.0.0'
  #   fast-uri    — GHSA-jqff-g426-hqxp, host confusion via percent-encoded scheme
  #                 normalisation. Reached through fastify's schema compiler:
  #                 @nestjs/platform-fastify > fastify > @fastify/ajv-compiler >
  #                 ajv > fast-uri, across forty paths. Nothing we import directly.
  #
  #                 NOTE THE BOUND. The advisory has TWO vulnerable ranges —
  #                 >=3.0.0 <3.1.6 and >=4.0.0 <4.1.3 — and this dependency tree
  #                 resolves into the 4.x line. `>=3.1.6` looks like the fix and is
  #                 not: it happily resolves 4.1.2, which is still vulnerable, and
  #                 `pnpm audit` then reports the SAME advisory against the new
  #                 version. Anything below 4.1.3 is wrong here.
  fast-uri: '>=4.1.3'
  #   mysql2      — GHSA on <3.22.0. Reached only through `prisma`, which pins it
  #                 EXACTLY at 3.15.3, so this forces a bump past an exact pin the
  #                 same way deepmerge-ts does above.
  #
  #                 Worth knowing what this actually is: mysql2 is Prisma's MySQL
  #                 driver. This project is PostgreSQL-only (ADR-003) and connects
  #                 through @prisma/adapter-pg, so the package ships in node_modules
  #                 and is never loaded. The override is here to keep `pnpm audit
  #                 --audit-level=high` — and therefore the pre-push gate — honest,
  #                 not because the vulnerable code path is reachable.
  mysql2: '>=3.22.0'
  #   js-yaml     — GHSA-2883-xcg3-v3hh, empty merge sources escape the
  #                 maxTotalMergeKeys cap and burn CPU. Dev-only: every one of the
  #                 fourteen paths runs through eslint, so nothing ships with it.
  #                 Overridden rather than chased through an eslint major bump —
  #                 the tree holds exactly one js-yaml (4.3.1), so this is a patch
  #                 bump with no 3.x callers to break on the 4.x API.
  #
  #                 CARET, NOT '>='. An open range here resolved js-yaml 5.4.1 —
  #                 a major bump on eslint's own config loader, bought for a
  #                 dev-only advisory that is fixed inside the 4.x line. Same
  #                 trap as nanoid above. The fix is 4.3.2; stay in 4.x.
  js-yaml: '^4.3.2'

  # --- 7 Oct 2026 --------------------------------------------------------
  #
  #   fastify     — GHSA-667r-xxjv-c9mm and GHSA-p68q-wchp-6fh7, both fixed in
  #                 5.12.2. This is the HTTP server itself, reached on every
  #                 request, so it is the most exposed entry on the list.
  #                 Overridden as well as bumped in apps/api, because
  #                 @nestjs/platform-fastify carries its own copy.
  fastify: '>=5.12.2'
  #   brace-expansion — GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p. THREE
  #                 vulnerable ranges, and this tree resolves into all of them:
  #                 1.x via eslint's minimatch, 2.x via @swc/cli, 4.x via
  #                 typescript-eslint.
  #
  #                 NOT OVERRIDDEN, and the attempt is worth recording. Forcing
  #                 '>=5.0.11' broke eslint outright — "TypeError: expand is not
  #                 a function", because minimatch@3 does
  #                 `require('brace-expansion')` expecting 1.x's CommonJS
  #                 default export. Per-major selectors
  #                 ('brace-expansion@1' and friends) did not bind either:
  #                 minimatch@3 still resolved to 5.0.12.
  #
  #                 Every path is eslint, @swc/cli or typescript-eslint, so
  #                 nothing here reaches a server. Ignored below rather than
  #                 forced, because a toolchain broken to satisfy a gate is
  #                 worse than an advisory that cannot be reached.
  #   piscina     — GHSA-67c8-pqhq-4rmx, CRITICAL. Dev-only: @nestjs/cli >
  #                 @swc/cli > piscina, so it compiles the API and never runs on
  #                 a server. Fixed anyway to keep the pre-push gate honest.
  piscina: '>=4.9.4'
  #   @xhmikosr/decompress — GHSA-hrh2-vp3x-79xf, CRITICAL. Dev-only, same
  #                 @nestjs/cli > @swc/cli chain: it unpacks the SWC binary at
  #                 install time.
  '@xhmikosr/decompress': '>=10.2.2'
  #   http-cache-semantics — GHSA-ch52-4w7c-c8xp. Dev-only, same chain.
  http-cache-semantics: '>=4.2.1'
  #   source-map-js — GHSA-68fv-2mgg-jv7q. Dev-only, through the webpack type
  #                 checker the Nest CLI runs in watch mode.
  source-map-js: '>=1.2.2'

  # --- 22 Oct 2026 -------------------------------------------------------
  #
  #   vite        — GHSA-587h-7wmj-h5pm, launch-editor's `fs.existsSync()`
  #                 existence check. Fixed in 8.2.4; the tree held 8.2.0.
  #                 Dev-only: all six paths are vitest > @vitest/mocker > vite,
  #                 so this is the test runner's bundler and nothing ships it.
  #
  #                 CARET, NOT '>='. This file already records two open ranges
  #                 that jumped a major and broke their caller — nanoid to 6,
  #                 js-yaml to 5. The fix is inside 8.x; stay in it.
  vite: '^8.2.4'

# -----------------------------------------------------------------------------
# IGNORED ADVISORIES
#
# pnpm 10 moved this out of package.json's `pnpm` field and into this file,
# the same way it moved `overrides` above — it is silently ignored in
# package.json, which looks exactly like the advisory being unsuppressable.
#
#   GHSA-vfj7-8cjw-p6xm — braces, ReDoS. Ignored on 7 Oct 2026 because THERE IS
#     NO FIX: the advisory names 3.0.4 as patched and npm's latest braces is
#     3.0.3. Nothing to upgrade to.
#
#     Reached only as tailwindcss > chokidar > braces, which is Tailwind's file
#     watcher. It runs at build time against this repo's own glob patterns —
#     never against anything a patient or a clinic sends — so the untrusted
#     input a ReDoS needs cannot arrive. Escaping it entirely means Tailwind 4,
#     which drops chokidar and is a major upgrade of the whole design system.
#
#     REVISIT when braces publishes a fix, or when Tailwind 4 is on the table.
#     Remove this entry first and let the gate tell you whether it is still
#     needed.
#
#   GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p — brace-expansion, ReDoS.
#     Ignored on 7 Oct 2026. See the brace-expansion note in `overrides`
#     above for why forcing the fixed version is not available here: it
#     breaks eslint, and the per-major selectors do not bind.
#
#     All fourteen paths run through eslint, @swc/cli or typescript-eslint —
#     build and lint tooling, none of it shipped. REVISIT when eslint's
#     minimatch moves off 1.x, which removes the caller that cannot take the
#     new major.
# -----------------------------------------------------------------------------

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-qhr7-859c-m2p7
    - GHSA-6j4f-fj2g-mc7p
